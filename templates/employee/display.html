{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Employees</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="card" style="width: 100%; max-width: 500px;">
        <h2>Employee List</h2>

        {% if employees %}
            <table>
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>City</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    {% for emp in employees %}
                        <tr>
                            <td>{{ emp.empid }}</td>
                            <td>{{ emp.name }}</td>
                            <td>{{ emp.age }}</td>
                            <td>{{ emp.city }}</td>
                            <td>{{ emp.email }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p style="color: #666; margin-bottom: 20px;">
                No employees registered yet!
            </p>
        {% endif %}

        <button onclick="location.href='{% url 'employee' %}'" class="btn btn-back">Back to Dashboard</button>
    </div>

</body>
</html>
