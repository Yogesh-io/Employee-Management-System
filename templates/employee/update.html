{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="card">
        <h2>Update Profile</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="msg">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Employee ID (Non-editable):</label>
            <input type="text" value="{{ emp.empid }}" disabled>

            <label>Name:</label>
            <input type="text" name="name" value="{{ emp.name }}" required>

            <label for="age">Age:</label>
            <input type="number" name="age" value="{{emp.age}}"required>
            
            <label for="city">City:</label>
            <input type="text" value="{{ emp.city }}" name="city" required>

            <label>Email:</label>
            <input type="email" name="email" value="{{ emp.email }}" required>

            <label>Password:</label>
            <input type="password" name="password" value="{{ emp.password }}" required>

            <button type="submit" class="btn">Update Details</button>
        </form>

        <a href="{% url 'employee' %}" class="btn btn-back">Back to Profile</a>
    </div>

</body>
</html>
